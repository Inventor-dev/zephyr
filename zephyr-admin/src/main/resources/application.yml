server:
  port: 7000
spring:
  application:
    name: zephyr-admin
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zephyr?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
