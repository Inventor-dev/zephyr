<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Platform Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #020617;
    color: #e2e8f0;
    font-family: 'JetBrains Mono', monospace;
    padding: 40px;
    min-height: 100vh;
}
.header {
    text-align: center;
    margin-bottom: 40px;
}
.header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}
.header h1::before {
    content: '';
    width: 12px;
    height: 12px;
    background: #22d3ee;
    border-radius: 50%;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.header .subtitle {
    font-size: 14px;
    color: #64748b;
}
.diagram-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 30px;
    overflow-x: auto;
}
.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 30px;
}
.summary-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
}
.summary-card .value {
    font-size: 24px;
    font-weight: 700;
    color: #22d3ee;
}
.summary-card .label {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
}
.footer {
    text-align: center;
    font-size: 11px;
    color: #475569;
    margin-top: 20px;
}
</style>
</head>
<body>

<div class="header">
    <h1>Base Platform Architecture</h1>
    <div class="subtitle">Spring Boot 4.x + Java 25 + COLA + Qiankun Micro-Frontend | v1.0</div>
</div>
