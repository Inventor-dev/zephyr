<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zephyr Logo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0f1219;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 80px;
    font-family: 'Noto Sans SC', sans-serif;
}
.section {
    text-align: center;
}
.section h2 {
    color: #64748b;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 30px;
}
.row {
    display: flex;
    gap: 60px;
    align-items: center;
}
.card {
    background: #1a1f2e;
    border: 1px solid #2a3042;
    border-radius: 16px;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card-dark {
    background: #020617;
}
</style>
</head>
<body>

<!-- ========== 1. Icon Logo (图标) ========== -->
<div class="section">
    <h2>Icon Logo</h2>
    <div class="row">

        <!-- Icon: 浅色背景 -->
        <div class="card" style="width: 200px; height: 200px;">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="windGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#7dd3fc"/>
                        <stop offset="50%" style="stop-color:#38bdf8"/>
                        <stop offset="100%" style="stop-color:#0ea5e9"/>
                    </linearGradient>
                    <linearGradient id="windGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.6"/>
                        <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.2"/>
                    </linearGradient>
                </defs>
                <!-- 背景圆 -->
                <circle cx="60" cy="60" r="56" fill="#0c1526" stroke="#1e3a5f" stroke-width="1"/>
                <!-- 微风曲线 - 三条流动的风线 -->
                <path d="M 25 45 Q 45 35, 60 45 Q 75 55, 95 42" fill="none" stroke="url(#windGrad1)" stroke-width="3" stroke-linecap="round" opacity="0.9">
                    <animate attributeName="d" dur="4s" repeatCount="indefinite"
                        values="M 25 45 Q 45 35, 60 45 Q 75 55, 95 42;
                                M 25 45 Q 45 40, 60 42 Q 75 48, 95 42;
                                M 25 45 Q 45 35, 60 45 Q 75 55, 95 42"/>
                </path>
                <path d="M 20 60 Q 40 50, 55 60 Q 70 70, 100 55" fill="none" stroke="url(#windGrad1)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
                    <animate attributeName="d" dur="5s" repeatCount="indefinite"
                        values="M 20 60 Q 40 50, 55 60 Q 70 70, 100 55;
                                M 20 60 Q 40 55, 55 57 Q 70 62, 100 55;
                                M 20 60 Q 40 50, 55 60 Q 70 70, 100 55"/>
                </path>
                <path d="M 28 75 Q 48 65, 65 75 Q 80 85, 98 70" fill="none" stroke="url(#windGrad1)" stroke-width="2" stroke-linecap="round" opacity="0.5">
                    <animate attributeName="d" dur="6s" repeatCount="indefinite"
                        values="M 28 75 Q 48 65, 65 75 Q 80 85, 98 70;
                                M 28 75 Q 48 70, 65 72 Q 80 78, 98 70;
                                M 28 75 Q 48 65, 65 75 Q 80 85, 98 70"/>
                </path>
                <!-- Z 字母点缀 -->
                <text x="60" y="95" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" opacity="0.4">Z</text>
            </svg>
        </div>

        <!-- Icon: 深色背景 -->
        <div class="card card-dark" style="width: 200px; height: 200px;">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="windGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bae6fd"/>
                        <stop offset="50%" style="stop-color:#7dd3fc"/>
                        <stop offset="100%" style="stop-color:#38bdf8"/>
                    </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="56" fill="transparent" stroke="#1e3a5f" stroke-width="1"/>
                <path d="M 25 45 Q 45 35, 60 45 Q 75 55, 95 42" fill="none" stroke="url(#windGradDark)" stroke-width="3" stroke-linecap="round" opacity="0.9">
                    <animate attributeName="d" dur="4s" repeatCount="indefinite"
                        values="M 25 45 Q 45 35, 60 45 Q 75 55, 95 42;
                                M 25 45 Q 45 40, 60 42 Q 75 48, 95 42;
                                M 25 45 Q 45 35, 60 45 Q 75 55, 95 42"/>
                </path>
                <path d="M 20 60 Q 40 50, 55 60 Q 70 70, 100 55" fill="none" stroke="url(#windGradDark)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
                    <animate attributeName="d" dur="5s" repeatCount="indefinite"
                        values="M 20 60 Q 40 50, 55 60 Q 70 70, 100 55;
                                M 20 60 Q 40 55, 55 57 Q 70 62, 100 55;
                                M 20 60 Q 40 50, 55 60 Q 70 70, 100 55"/>
                </path>
                <path d="M 28 75 Q 48 65, 65 75 Q 80 85, 98 70" fill="none" stroke="url(#windGradDark)" stroke-width="2" stroke-linecap="round" opacity="0.5">
                    <animate attributeName="d" dur="6s" repeatCount="indefinite"
                        values="M 28 75 Q 48 65, 65 75 Q 80 85, 98 70;
                                M 28 75 Q 48 70, 65 72 Q 80 78, 98 70;
                                M 28 75 Q 48 65, 65 75 Q 80 85, 98 70"/>
                </path>
                <text x="60" y="95" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" opacity="0.4">Z</text>
            </svg>
        </div>

        <!-- Icon: 方角 -->
        <div class="card" style="width: 200px; height: 200px;">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="windGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#7dd3fc"/>
                        <stop offset="100%" style="stop-color:#0ea5e9"/>
                    </linearGradient>
                </defs>
                <rect x="4" y="4" width="112" height="112" rx="24" fill="#0c1526" stroke="#1e3a5f" stroke-width="1"/>
                <path d="M 25 42 Q 45 32, 60 42 Q 75 52, 95 39" fill="none" stroke="url(#windGradSq)" stroke-width="3" stroke-linecap="round" opacity="0.9">
                    <animate attributeName="d" dur="4s" repeatCount="indefinite"
                        values="M 25 42 Q 45 32, 60 42 Q 75 52, 95 39;
                                M 25 42 Q 45 37, 60 39 Q 75 45, 95 39;
                                M 25 42 Q 45 32, 60 42 Q 75 52, 95 39"/>
                </path>
                <path d="M 20 57 Q 40 47, 55 57 Q 70 67, 100 52" fill="none" stroke="url(#windGradSq)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
                    <animate attributeName="d" dur="5s" repeatCount="indefinite"
                        values="M 20 57 Q 40 47, 55 57 Q 70 67, 100 52;
                                M 20 57 Q 40 52, 55 54 Q 70 59, 100 52;
                                M 20 57 Q 40 47, 55 57 Q 70 67, 100 52"/>
                </path>
                <path d="M 28 72 Q 48 62, 65 72 Q 80 82, 98 67" fill="none" stroke="url(#windGradSq)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                <text x="60" y="95" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" opacity="0.4">Z</text>
            </svg>
        </div>

    </div>
</div>

<!-- ========== 2. Text Logo (纯字母) ========== -->
<div class="section">
    <h2>Text Logo</h2>
    <div class="row">

        <!-- 横版 浅色 -->
        <div class="card" style="padding: 30px 50px;">
            <svg viewBox="0 0 360 70" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#7dd3fc"/>
                        <stop offset="100%" style="stop-color:#0ea5e9"/>
                    </linearGradient>
                </defs>
                <!-- 微风装饰线 -->
                <path d="M 5 25 Q 20 18, 35 25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                <path d="M 8 35 Q 23 28, 38 35" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
                <!-- Z 字母 -->
                <text x="55" y="48" fill="url(#textGrad)" font-size="42" font-weight="700" font-family="JetBrains Mono, monospace">Z</text>
                <!-- ephyr -->
                <text x="90" y="48" fill="#cbd5e1" font-size="36" font-weight="400" font-family="JetBrains Mono, monospace">ephyr</text>
                <!-- 和风小字 -->
                <text x="285" y="32" fill="#64748b" font-size="10" font-family="Noto Sans SC, sans-serif" font-weight="300">和風</text>
                <text x="285" y="48" fill="#475569" font-size="9" font-family="Noto Sans SC, sans-serif" font-weight="300">微风</text>
            </svg>
        </div>

        <!-- 横版 深色 -->
        <div class="card card-dark" style="padding: 30px 50px;">
            <svg viewBox="0 0 360 70" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#bae6fd"/>
                        <stop offset="100%" style="stop-color:#7dd3fc"/>
                    </linearGradient>
                </defs>
                <path d="M 5 25 Q 20 18, 35 25" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                <path d="M 8 35 Q 23 28, 38 35" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
                <text x="55" y="48" fill="url(#textGradDark)" font-size="42" font-weight="700" font-family="JetBrains Mono, monospace">Z</text>
                <text x="90" y="48" fill="#e2e8f0" font-size="36" font-weight="400" font-family="JetBrains Mono, monospace">ephyr</text>
                <text x="285" y="32" fill="#64748b" font-size="10" font-family="Noto Sans SC, sans-serif" font-weight="300">和風</text>
                <text x="285" y="48" fill="#475569" font-size="9" font-family="Noto Sans SC, sans-serif" font-weight="300">微风</text>
            </svg>
        </div>

    </div>
</div>

<!-- ========== 3. Vertical Logo (竖版) ========== -->
<div class="section">
    <h2>Vertical Logo</h2>
    <div class="row">

        <div class="card" style="padding: 40px; width: 160px;">
            <svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="vertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#7dd3fc"/>
                        <stop offset="100%" style="stop-color:#0ea5e9"/>
                    </linearGradient>
                </defs>
                <!-- 图标 -->
                <circle cx="50" cy="45" r="35" fill="#0c1526" stroke="#1e3a5f" stroke-width="1"/>
                <path d="M 20 35 Q 35 25, 50 35 Q 65 45, 80 32" fill="none" stroke="url(#vertGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
                    <animate attributeName="d" dur="4s" repeatCount="indefinite"
                        values="M 20 35 Q 35 25, 50 35 Q 65 45, 80 32;
                                M 20 35 Q 35 30, 50 32 Q 65 38, 80 32;
                                M 20 35 Q 35 25, 50 35 Q 65 45, 80 32"/>
                </path>
                <path d="M 16 48 Q 31 38, 46 48 Q 61 58, 84 44" fill="none" stroke="url(#vertGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M 22 60 Q 37 50, 52 60 Q 67 70, 82 56" fill="none" stroke="url(#vertGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                <text x="50" y="72" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" opacity="0.4">Z</text>
                <!-- 文字 -->
                <text x="50" y="110" fill="#0ea5e9" font-size="18" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">Zephyr</text>
                <text x="50" y="130" fill="#64748b" font-size="9" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-weight="300">和風 · 微風</text>
            </svg>
        </div>

        <div class="card card-dark" style="padding: 40px; width: 160px;">
            <svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="vertGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bae6fd"/>
                        <stop offset="100%" style="stop-color:#7dd3fc"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="45" r="35" fill="transparent" stroke="#1e3a5f" stroke-width="1"/>
                <path d="M 20 35 Q 35 25, 50 35 Q 65 45, 80 32" fill="none" stroke="url(#vertGradDark)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
                    <animate attributeName="d" dur="4s" repeatCount="indefinite"
                        values="M 20 35 Q 35 25, 50 35 Q 65 45, 80 32;
                                M 20 35 Q 35 30, 50 32 Q 65 38, 80 32;
                                M 20 35 Q 35 25, 50 35 Q 65 45, 80 32"/>
                </path>
                <path d="M 16 48 Q 31 38, 46 48 Q 61 58, 84 44" fill="none" stroke="url(#vertGradDark)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M 22 60 Q 37 50, 52 60 Q 67 70, 82 56" fill="none" stroke="url(#vertGradDark)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                <text x="50" y="72" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" opacity="0.4">Z</text>
                <text x="50" y="110" fill="#7dd3fc" font-size="18" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">Zephyr</text>
                <text x="50" y="130" fill="#64748b" font-size="9" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-weight="300">和風 · 微風</text>
            </svg>
        </div>

    </div>
</div>

<div style="text-align: center; color: #475569; font-size: 11px; margin-top: 40px; font-family: 'JetBrains Mono', monospace;">
    Generated by 🦞 小龙虾 · Zephyr Logo · 和風微風
</div>

</body>
</html>
